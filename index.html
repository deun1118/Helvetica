<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helvetica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --seasonal-bg: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            --font-brand: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --color-bg: #000000;
            --color-text: #ffffff;
            --color-dim: rgba(255, 255, 255, 0.4);
            --color-border: rgba(255, 255, 255, 0.1);
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-brand); overflow: hidden; width: 100vw; height: 100vh; }
        ::-webkit-scrollbar { display: none; }

        .site-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: var(--seasonal-bg); background-size: cover; background-position: center; filter: brightness(0.25) contrast(1.1); z-index: 1; transition: var(--transition-smooth); }

        /* 모서리 네비게이션 기본 위치 설정 */
        .corner-nav { position: fixed; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-dim); z-index: 100; padding: 40px; cursor: pointer; transition: var(--transition-smooth); }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }

        /* --------------------------------------------------
           [추가된 아이콘 스타일] 원래 기능과 겹치지 않게 분리했습니다.
        -------------------------------------------------- */
        .nav-icon {
            width: 32px;       /* 아이콘 크기 (원하는 대로 조절 가능) */
            height: 32px;
            object-fit: contain;
            display: block;
            transition: var(--transition-smooth);
        }
        .corner-nav:hover .nav-icon {
            transform: scale(1.1);
        }
        /* -------------------------------------------------- */

        .page-container { position: relative; width: 100%; height: 100%; z-index: 10; }
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transform: scale(1.03); transition: opacity 0.8s, transform 0.8s, visibility 0.8s; padding: 120px 80px; overflow: hidden; }
        .page.active { opacity: 1; visibility: visible; transform: scale(1); }
        
        .page-inner { max-width: 1400px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
        .page-header { margin-bottom: 60px; }
        .page-title { font-size: 14px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-dim); margin-bottom: 8px; }
        .page-line { width: 40px; height: 1px; background-color: var(--color-border); }

        .home-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 20; text-align: center; }
        .release-card { width: 280px; height: 280px; background-color: #111; margin-bottom: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); cursor: pointer; transition: var(--transition-smooth); position: relative; overflow: hidden; }
        .release-card:hover { transform: scale(1.02); box-shadow: 0 40px 80px rgba(0,0,0,0.9); }
        .release-card img { width: 100%; height: 100%; object-fit: cover; }
        .release-title { font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
        .release-subtitle { font-size: 10px; letter-spacing: 0.05em; color: var(--color-dim); }

        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; overflow-y: auto; padding-bottom: 60px; height: calc(100% - 100px); }
        .grid-item { position: relative; aspect-ratio: 1; background-color: #080808; border: 1px solid var(--color-border); cursor: pointer; overflow: hidden; transition: var(--transition-smooth); }
        .grid-item:hover { border-color: var(--color-dim); }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition-smooth); }
        .grid-item:hover img { transform: scale(1.03); }

        .list-container { display
