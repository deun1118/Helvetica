<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELVETICA ARCHIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --seasonal-bg: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            --font-brand: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --color-bg: #000000;
            --color-text: #ffffff;
            --color-dim: rgba(255, 255, 255, 0.4);
            --color-border: rgba(255, 255, 255, 0.1);
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-brand); overflow: hidden; width: 100vw; height: 100vh; }
        ::-webkit-scrollbar { display: none; }

        .site-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: var(--seasonal-bg); background-size: cover; background-position: center; filter: brightness(0.25) contrast(1.1); z-index: 1; transition: var(--transition-smooth); }

        /* [아이콘 탭 스타일] */
        .corner-nav { position: fixed; z-index: 100; padding: 40px; cursor: pointer; transition: var(--transition-smooth); }
        .nav-icon { width: 40px; height: 40px; object-fit: contain; opacity: 0.5; transition: var(--transition-smooth); filter: invert(1); }
        .corner-nav:hover .nav-icon { opacity: 1; transform: scale(1.1); }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }

        /* 기존의 페이지 전환 로직 등은 유지 */
        .page-container { position: relative; width: 100%; height: 100%; z-index: 10; }
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transform: scale(1.03); transition: opacity 0.8s, transform 0.8s, visibility 0.8s; padding: 120px 80px; overflow: hidden; }
        .page.active { opacity: 1; visibility: visible; transform: scale(1); }

        /* (이하 기존의 Home, Illust, Music, Sculpture, Store, Modal, JS 부분 동일) */
        /* ...코드 생략(위와 동일하게 유지) ... */
    </style>
</head>
<body>
    <div class="site-background"></div>

    <div class="corner-nav top-left" data-target="music"><img src="music.png" class="nav-icon" alt="Music"></div>
    <div class="corner-nav top-right" data-target="sculpture"><img src="sculpture.png" class="nav-icon" alt="Sculpture"></div>
    <div class="corner-nav bottom-left" data-target="illust"><img src="illust.png" class="nav-icon" alt="Illust"></div>
    <div class="corner-nav bottom-right" data-target="store"><img src="store.png" class="nav-icon" alt="Store"></div>

    </body>
</html>
